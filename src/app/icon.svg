<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- White rounded square background -->
  <rect width="100" height="100" rx="18" fill="#ffffff"/>

  <!-- Blue 3-D letter D body -->
  <path d="M10,10 L10,90 L46,90 C76,90 86,72 86,50 C86,28 76,10 46,10 Z" fill="#1a6ec4"/>
  <!-- D inner cutout -->
  <path d="M24,23 L24,77 L45,77 C63,77 70,65 70,50 C70,35 63,23 45,23 Z" fill="#ffffff"/>

  <!-- Orange B-swash — two-bump ribbon -->
  <!-- Upper bump -->
  <path d="M56,10 C96,16 96,42 56,48" stroke="#f5a020" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Lower bump -->
  <path d="M56,48 C96,54 96,82 56,90" stroke="#f5a020" stroke-width="14" fill="none" stroke-linecap="round"/>
</svg>
